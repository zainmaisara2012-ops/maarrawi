<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#16110d;color:#f1e7d8}
header{background:#2a1d13;padding:22px 14px;text-align:center;border-bottom:2px solid #c9a24d}
header h1{margin:0;font-size:24px;color:#e0b95a}
header p{margin:6px 0 0;font-size:13px;color:#b9a98f}
.warn{background:#3a2a12;color:#f0cf85;text-align:center;padding:8px;font-size:12px}
.bar{max-width:1000px;margin:auto;padding:12px}
.bar input{width:100%;padding:12px;border:1px solid #4a3a28;border-radius:10px;background:#221a13;color:#fff;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;max-width:1000px;margin:auto}
.chip{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1px solid #4a3a28;background:#221a13;color:#d8c7a8;cursor:pointer;font-size:14px}
.chip.on{background:#c9a24d;color:#1a120a;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:12px 12px 100px;max-width:1000px;margin:auto}
.card{background:#221a13;border:1px solid #3a2d20;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#33281c}
.badge{position:absolute;top:8px;right:8px;background:#b3261e;color:#fff;font-size:12px;padding:3px 10px;border-radius:10px}
.info{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.brand{font-size:12px;color:#c9a24d}
.name{font-weight:bold}
.desc{font-size:13px;color:#a8977c}
.price{color:#e0b95a;font-weight:bold;font-size:14px}
.btn{display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;padding:10px;border-radius:9px;font-size:14px;margin-top:auto}
.float{position:fixed;bottom:16px;left:16px;background:#25d366;color:#fff;text-decoration:none;padding:14px 18px;border-radius:30px;box-shadow:0 2px 10px #000a;font-weight:bold}
.empty{text-align:center;padding:40px;color:#8a7a62;grid-column:1/-1}
#gate{position:fixed;inset:0;background:#0d0906;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
#gate div{background:#221a13;border:1px solid #c9a24d;border-radius:16px;padding:28px;max-width:360px;text-align:center}
#gate h2{color:#e0b95a;margin-top:0}
#gate button{padding:12px 26px;border:0;border-radius:10px;font-size:16px;margin:6px;cursor:pointer}
#yes{background:#c9a24d;color:#1a120a;font-weight:bold}
#no{background:#3a2d20;color:#ddd}
</style>
</head>
<body>
<div id="gate"><div>
<h2 id="gt"></h2>
<p>هذا الموقع مخصص لبيع منتجات التبغ للبالغين فقط.<br>هل عمرك 18 سنة أو أكثر؟</p>
<button id="yes">نعم، عمري +18</button>
<button id="no">لا</button>
</div></div>
<header><h1 id="store"></h1><p>منتجات التبغ والأرجيلة</p></header>
<div class="warn">⚠️ التدخين ضار بالصحة · البيع للبالغين (18+) فقط</div>
<div class="bar"><input id="q" placeholder="ابحث عن منتج أو ماركة..."></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"><div class="empty">جاري التحميل...</div></div>
<a class="float" id="fl" target="_blank">تواصل مع الإدارة 💬</a>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
document.title=STORE_NAME;
store.textContent=STORE_NAME;gt.textContent=STORE_NAME;
try{if(localStorage.getItem("age18")==="1")gate.remove()}catch(e){}
yes.onclick=()=>{try{localStorage.setItem("age18","1")}catch(e){}gate.remove()};
no.onclick=()=>{document.body.innerHTML='<div style="color:#fff;text-align:center;padding:60px">عذراً، لا يمكنك دخول هذا الموقع.</div>'};
const wa=t=>`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(t)}`;
fl.href=wa("مرحباً، أريد الاستفسار");
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let P=[],cat="";
function drawChips(){
chips.innerHTML=["الكل",...CATEGORIES].map(c=>`<div class="chip ${(c==="الكل"&&!cat)||c===cat?"on":""}" data-c="${c}">${c}</div>`).join("");
chips.querySelectorAll(".chip").forEach(e=>e.onclick=()=>{cat=e.dataset.c==="الكل"?"":e.dataset.c;drawChips();render()});
}
function render(){
const k=q.value.trim();
const list=P.filter(p=>(!cat||p.category===cat)&&(!k||(p.name+" "+(p.brand||"")+" "+(p.desc||"")).includes(k)));
if(!list.length){grid.innerHTML='<div class="empty">لا توجد منتجات</div>';return}
grid.innerHTML=list.map(p=>`<div class="card">${p.available===false?'<div class="badge">نفذ</div>':''}<img src="${p.image||""}" alt=""><div class="info"><div class="brand">${esc(p.brand)}</div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.desc)}</div><div class="price">السعر عند الطلب</div><a class="btn" target="_blank" href="${wa("مرحباً، أريد الاستفسار عن سعر: "+p.name+(p.brand?" ("+p.brand+")":""))}">اسأل عن السعر</a></div></div>`).join("");
}
q.oninput=render;
drawChips();
db.collection("products").orderBy("createdAt","desc").get()
.then(s=>{P=s.docs.map(d=>d.data());render()})
.catch(()=>{grid.innerHTML='<div class="empty">تعذر تحميل المنتجات</div>'});
</script>
</body>
</html>
