<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef2f9;color:#0b2545;padding:14px}
.box{max-width:600px;margin:0 auto 14px;background:#fff;border:1px solid #d5deed;border-radius:14px;padding:16px}
h2{margin-top:0;color:#0b2545}
input,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #c5d1e6;border-radius:9px;background:#fff;color:#0b2545;font-size:15px;font-family:inherit}
button{padding:10px 16px;border:0;border-radius:9px;background:#0b2545;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}
button.del{background:#b3261e;padding:7px 12px;font-size:13px}
button.tg{background:#e8eef8;color:#0b2545;padding:7px 12px;font-size:13px}
.item{display:flex;gap:10px;align-items:center;border-bottom:1px solid #e3e9f4;padding:10px 0}
.item img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#e8eef8}
.item .t{flex:1}
.item small{color:#5b6b85}
.btns{display:flex;flex-direction:column;gap:6px}
#msg{text-align:center;font-weight:bold;min-height:24px}
.hide{display:none}
</style>
</head>
<body>
<div class="box" id="loginBox">
<h2>🔐 دخول الإدارة</h2>
<input type="password" id="pw" placeholder="كلمة السر">
<button id="loginBtn">دخول</button>
</div>
<div id="panel" class="hide">
<div class="box">
<h2>➕ إضافة منتج</h2>
<input id="n" placeholder="اسم المنتج">
<input id="c" list="cl" placeholder="نوع المنتج (اكتب أي نوع)">
<datalist id="cl"></datalist>
<textarea id="d" rows="2" placeholder="وصف (اختياري)"></textarea>
<input type="file" id="img" accept="image/*">
<button id="addBtn">إضافة المنتج</button>
</div>
<div class="box"><h2>📦 المنتجات</h2><div id="list">جاري التحميل...</div></div>
<div class="box"><button id="outBtn">تسجيل خروج</button></div>
</div>
<div id="msg"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const auth=firebase.auth();
const say=t=>msg.textContent=t;
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let items=[];
loginBtn.onclick=async()=>{
say("جاري الدخول...");
try{await auth.signInWithEmailAndPassword(ADMIN_EMAIL,pw.value);say("")}
catch(e){say("❌ كلمة السر غير صحيحة")}
};
outBtn.onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{
loginBox.classList.toggle("hide",!!u);
panel.classList.toggle("hide",!u);
if(u)load();
});
async function load(){
const s=await db.collection("products").orderBy("createdAt","desc").get();
items=s.docs.map(d=>({id:d.id,...d.data()}));
cl.innerHTML=[...new Set(items.map(p=>p.category).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join("");
list.innerHTML=items.length?items.map((p,i)=>`<div class="item"><img src="${p.image||""}"><div class="t"><b>${esc(p.name)}</b><br><small>${esc(p.category)} · ${p.available===false?"نفذ":"متوفر"}</small></div><div class="btns"><button class="tg" onclick="tgl(${i})">${p.available===false?"إتاحة":"نفذ"}</button><button class="del" onclick="del(${i})">حذف</button></div></div>`).join(""):"لا توجد منتجات";
}
function resize(file){
return new Promise(res=>{
const im=new Image(),fr=new FileReader();
fr.onload=()=>{im.onload=()=>{
const m=600,s=Math.min(1,m/Math.max(im.width,im.height));
const cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;
cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
res(cv.toDataURL("image/jpeg",0.7));
};im.src=fr.result};
fr.readAsDataURL(file);
});
}
addBtn.onclick=async()=>{
const name=n.value.trim();
if(!name){say("اكتب اسم المنتج");return}
say("جاري الحفظ...");
try{
const f=img.files[0];
const image=f?await resize(f):"";
await db.collection("products").add({name,category:c.value.trim(),desc:d.value.trim(),image,available:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
n.value=c.value=d.value=img.value="";
say("✅ تمت الإضافة");load();
}catch(e){say("❌ خطأ: تأكد من الـ Rules وكلمة السر")}
};
async function tgl(i){
const p=items[i];
await db.collection("products").doc(p.id).update({available:p.available===false});
load();
}
async function del(i){
if(!confirm("حذف هذا المنتج؟"))return;
await db.collection("products").doc(items[i].id).delete();
say("✅ تم الحذف");load();
}
</script>
</body>
</html>
